<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- EDIT: page title and description shown in search results and link previews -->
  <title>Tubosun — Portfolio</title>
  <meta name="description" content="Tubosun's personal site. Full portfolio coming soon." />
  <meta property="og:title" content="Tubosun — Portfolio" />
  <meta property="og:description" content="Full portfolio coming soon." />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-size='38' fill='%23f6f4ef'%3ET%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f6f4ef;
      --text: #161616;
      --muted: #6b6862;
      --line: #dcd8cf;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #ece9e2;
        --muted: #98948c;
        --line: #2c2b28;
        --accent: #fb923c;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 24px 48px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 span {
      display: block;
      font-weight: 400;
      color: var(--muted);
    }

    a {
      color: var(--text);
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      transition: text-decoration-color 150ms ease, color 150ms ease;
    }
    a:hover { text-decoration-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

    .intro {
      margin: 96px 0 0;
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      font-size: clamp(26px, 5vw, 34px);
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    .status {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    footer {
      margin-top: auto;
      padding-top: 96px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 15px;
      color: var(--muted);
    }

    footer a { color: var(--muted); }
    footer a:hover { color: var(--text); }

    .reveal {
      opacity: 0;
      transform: translateY(8px);
      animation: in 700ms cubic-bezier(.2,.7,.2,1) forwards;
    }
    .reveal:nth-child(2) { animation-delay: 120ms; }
    .reveal:nth-child(3) { animation-delay: 240ms; }
    .reveal:nth-child(4) { animation-delay: 360ms; }

    @keyframes in { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; animation: none; }
      .dot { animation: none; }
    }

    @media (max-width: 480px) {
      main { padding-top: 48px; }
      .intro { margin-top: 64px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="reveal">
      <!-- EDIT: your name and role -->
      <h1>Tubosun <span>Your role here</span></h1>
      <!-- EDIT: your contact email -->
      <a href="mailto:hello@yourdomain.com">Contact</a>
    </header>

    <!-- EDIT: one or two sentences about who you are and what you do -->
    <p class="intro reveal">
      I'm a [what you do] based in [city], currently [what you're working on].
    </p>

    <div class="status reveal">
      <span class="dot" aria-hidden="true"></span>
      Full website coming soon
    </div>

    <!-- EDIT: add, remove or reorder links. Delete any you don't use. -->
    <footer class="reveal">
      <a href="https://github.com/Tubosun162099">GitHub</a>
      <a href="https://www.linkedin.com/">LinkedIn</a>
      <span>© <span id="year">2026</span></span>
    </footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
